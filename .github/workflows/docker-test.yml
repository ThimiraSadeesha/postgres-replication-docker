name: Docker Compose Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Start Docker Compose
        run: |
          chmod +x init-primary.sh
          docker compose up -d
          sleep 30

      - name: Check containers are running
        run: docker compose ps

      - name: Test replication
        run: |
          docker exec postgres-replication-docker-pg-primary-1 \
            psql -U postgres -d mydb -c "CREATE TABLE test (id int);"
          docker exec postgres-replication-docker-pg-primary-1 \
            psql -U postgres -d mydb -c "INSERT INTO test VALUES (1);"
          docker exec postgres-replication-docker-pg-replica-1-1 \
            psql -U postgres -d mydb -c "SELECT * FROM test;"

      - name: Stop Docker Compose
        run: docker compose down -v